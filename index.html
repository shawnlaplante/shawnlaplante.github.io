<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>LaPlante Custom Tech Dashboard</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #0b1220;
    color: #fff;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px 16px;
  }
  .header h1 {
    margin: 0;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
  }
  .header .sub {
    font-size: 19px;
    color: #9db3d1;
    font-weight: 600;
    margin-top: 4px;
  }
  .period {
    font-size: 22px;
    font-weight: 800;
    color: #ff5a63;
    text-transform: uppercase;
    text-align: right;
  }
  .updated { font-size: 14px; color: #6b7fa3; font-weight: 600; text-align: right; margin-top: 4px; }
  .rollupbar {
    margin: 0 48px 20px;
    background: linear-gradient(135deg,#1e3a8a,#1e40af);
    border-radius: 16px;
    padding: 20px 36px;
    display: flex;
    gap: 60px;
    align-items: center;
  }
  .rollupbar .item .label { font-size: 15px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }
  .rollupbar .item .val { font-size: 34px; font-weight: 900; }
  .stage {
    margin: 0 48px;
    height: calc(100vh - 260px);
    position: relative;
  }
  .page {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 26px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .page.active { opacity: 1; pointer-events: auto; }
  .card {
    background: #131c2f;
    border: 1px solid #223052;
    border-radius: 18px;
    padding: 22px 26px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card.rank1 { background: linear-gradient(135deg,#3d2a06,#1a1400); border-color: #caa63a; }
  .rank {
    position: absolute;
    top: 18px; right: 18px;
    background: #b91c2b;
    color: #fff;
    font-weight: 900;
    font-size: 18px;
    padding: 5px 14px;
    border-radius: 8px;
  }
  .rank1 .rank { background: #caa63a; color: #1a1400; }
  .cardhead { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; padding-right: 60px; }
  .avatar { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #2a3654; border: 2px solid #3a4870; }
  .avatar.placeholder { display:flex; align-items:center; justify-content:center; font-weight:900; font-size:26px; color:#9db3d1; }
  .name { font-weight: 900; font-size: 25px; line-height: 1.15; }
  .jobsline { font-size: 15px; color: #9db3d1; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .stat .n { font-size: 22px; font-weight: 800; }
  .stat .l { font-size: 12px; color: #9db3d1; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat.rate { grid-column: 1/3; border-top: 1px solid #223052; padding-top: 10px; margin-top: 4px; }
  .stat.rate .n { color: #4ade80; font-size: 34px; }
  .dots { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #2a3654; }
  .dot.active { background: #ff5a63; }
</style>
</head>

function money(n){ return "$" + Number(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0}); }
function moneyc(n){ return "$" + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

document.getElementById("periodLabel").textContent = DATA.period;
document.getElementById("updatedLabel").textContent = "Updated " + DATA.updated;

document.getElementById("rollup").innerHTML = `
  <div class="item"><div class="label">Completed Jobs</div><div class="val">${DATA.totals.jobs}</div></div>
  <div class="item"><div class="label">Working Hours</div><div class="val">${DATA.totals.hours.toFixed(1)}</div></div>
  <div class="item"><div class="label">Attributed Revenue</div><div class="val">${money(DATA.totals.revenue)}</div></div>
  <div class="item"><div class="label">Blended Rev / Job Hour</div><div class="val">${moneyc(DATA.totals.blended)}</div></div>
`;

function card(t, rank){
  const photo = PHOTOS[t.name];
  const initials = t.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const avatar = photo
    ? `<img class="avatar" src="${photo}" alt="${t.name}">`
    : `<div class="avatar placeholder">${initials}</div>`;
  return `<div class="card ${rank===1?'rank1':''}">
    <div class="rank">#${rank}</div>
    <div class="cardhead">
      ${avatar}
      <div>
        <div class="name">${t.name}</div>
        <div class="jobsline">${t.jobs} completed jobs · ${t.hours.toFixed(1)} hrs</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">${money(t.revenue)}</div><div class="l">Revenue</div></div>
      <div class="stat"><div class="n">${t.hours.toFixed(2)}</div><div class="l">Hours</div></div>
      <div class="stat rate" style="grid-column:1/3"><div class="n">${t.rate!=null ? moneyc(t.rate) : "—"}</div><div class="l">Rev / Job Hour</div></div>
    </div>
  </div>`;
}

const PAGE_SIZE = 6;
const pages = [];
for (let i=0;i<ranked.length;i+=PAGE_SIZE){
  pages.push(ranked.slice(i, i+PAGE_SIZE));
}

const stage = document.getElementById("stage");
const dotsEl = document.getElementById("dots");

pages.forEach((pageTechs, idx) => {
  const pageDiv = document.createElement("div");
  pageDiv.className = "page" + (idx===0 ? " active" : "");
  pageDiv.innerHTML = pageTechs.map(t => card(t, t.rank)).join("");
  stage.appendChild(pageDiv);

  const dot = document.createElement("div");
  dot.className = "dot" + (idx===0 ? " active" : "");
  dotsEl.appendChild(dot);
});

let current = 0;
const pageEls = stage.querySelectorAll(".page");
const dotEls = dotsEl.querySelectorAll(".dot");

if (pages.length > 1) {
  setInterval(() => {
    pageEls[current].classList.remove("active");
    dotEls[current].classList.remove("active");
    current = (current + 1) % pages.length;
    pageEls[current].classList.add("active");
    dotEls[current].classList.add("active");
  }, 9000);
}
</script>

</body>
</html>
